site_name: cotbias
site_description: Official Python client & MCP Server for CFTC COT Bias Terminal Quant API
site_url: https://cot-bias-terminal.github.io/cotbias/
repo_url: https://github.com/cot-bias-terminal/cotbias
repo_name: cot-bias-terminal/cotbias
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            docstring_style: google
            show_signature_annotations: true
            separate_signature: true
            merge_init_into_class: true
            members_order: source

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - SDK:
      - Timeseries: sdk/timeseries.md
      - AI Inference: sdk/inference.md
      - Screener: sdk/screener.md
      - Markets Catalog: sdk/markets.md
      - Async Client: sdk/async.md
      - Retries & Timeouts: sdk/retries.md
      - Error Handling: sdk/errors.md
      - Configuration: sdk/configuration.md
  - MCP:
      - Overview: mcp/index.md
      - Claude Desktop: mcp/claude-desktop.md
      - Cursor IDE: mcp/cursor.md
      - Cline & Other Clients: mcp/cline.md
      - Available Tools: mcp/tools.md
      - Caching & Quota: mcp/caching.md
      - Troubleshooting: mcp/troubleshooting.md
  - Reference:
      - CotClient & AsyncCotClient: reference/client.md
      - Resources: reference/resources.md
      - Data Models: reference/models.md
      - Exceptions: reference/exceptions.md
      - Retry & Transports: reference/retry.md
      - MCP Server: reference/mcp.md
  - Changelog: changelog.md
