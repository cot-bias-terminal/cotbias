[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cotbias"
version = "0.2.0"
description = "Official Python client & MCP Server for CFTC COT Bias Terminal Quant API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "COTBiasTerminal", email = "support@cot-bias-terminal.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "httpx[http2]>=0.27.0",
    "pydantic>=2.9.0",
]

[project.optional-dependencies]
pandas = [
    "pandas>=2.0.0",
]
mcp = [
    "mcp>=2.0.0",
]
all = [
    "cotbias[pandas,mcp]",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
    "mypy>=1.10.0",
    "pandas>=2.0.0",
    "pandas-stubs>=2.0.0",
    "ruff>=0.5.0",
    "pre-commit>=3.7.0",
]

[project.scripts]
cotbias-mcp = "cotbias.mcp.server:main"

[project.urls]
Homepage = "https://cot-bias-terminal.com"
Documentation = "https://docs.cot-bias-terminal.com"
Repository = "https://github.com/cot-bias-terminal/cotbias"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
