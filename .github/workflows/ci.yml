name: CI

on:
  push:
    branches: [main, "feature/*"]
  pull_request:
    branches: [main]

jobs:
  verify-identity:
    name: Verify Commit Identity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 100

      - name: Verify commit authors and committers
        run: |
          echo "Scanning commits for unauthorized author or committer..."
          UNAUTHORIZED=$(git log -n 50 --format='%h | %an <%ae> | %cn <%ce>' | grep -v -E '(github@cot-bias-terminal\.com|noreply@github\.com)' || true)
          if [ -n "$UNAUTHORIZED" ]; then
            echo "❌ ERROR: Commits found with unauthorized author/committer:"
            echo "$UNAUTHORIZED"
            exit 1
          fi
          echo "✅ All recent commits match authorized cot-bias-terminal identity."

  test:
    name: Python ${{ matrix.python-version }} on ubuntu-latest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv sync --python ${{ matrix.python-version }} --extra all --extra dev

      - name: Ruff Check & Format
        run: |
          uv run --python ${{ matrix.python-version }} ruff check .
          uv run --python ${{ matrix.python-version }} ruff format --check .

      - name: Type Check (mypy)
        run: |
          uv run --python ${{ matrix.python-version }} mypy src tests

      - name: Run Tests (pytest)
        run: |
          uv run --python ${{ matrix.python-version }} pytest tests -v
